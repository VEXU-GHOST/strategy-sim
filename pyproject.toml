[project]
name = "push-back"
version = "0.1.0"
description = "VEX field strategy simulator with pluggable agents"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "pettingzoo",
    "gymnasium",
    "typer",
]

[project.optional-dependencies]
dev = ["black", "pytest"]

[project.scripts]
push-back = "push_back.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["push_back*"]

[tool.black]
target-version = ["py310"]
