[project]
name = "ghost-strategy"
version = "0.1.0"
description = "VEX field strategy simulator with pluggable agents"
requires-python = ">=3.10"
dependencies = [
    "av",
    "numpy",
    "pillow",
    "tqdm",
    "typer",
]

[project.optional-dependencies]
zoo = ["pettingzoo"]

[project.scripts]
ghost-strategy = "ghost_strategy.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["push_back*"]
